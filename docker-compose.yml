services:
  # 1. PostGIS Database
  db:
    image: postgis/postgis:16-3.4
    container_name: airfield-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: airfields
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airfields"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Airfield Resolution FastAPI Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airfield-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AIRFIELDS_DB_URL=postgresql://postgres:postgrespassword@db:5432/airfields
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
